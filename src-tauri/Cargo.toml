[package]
name = "plclogger"
version = "0.1.0"
description = "PLC Logger - SQL Server Data Viewer"
authors = ["Askworx"]
edition = "2021"

[[bin]]
name = "plclogger"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tiberius = { version = "0.12", features = ["sql-browser-tokio", "winauth", "tokio-rustls", "tds73"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
